name: Pipeline Continuos Integration laboratorio 9 (pair programmed con Juan Camilo Torres)

on:
  pull_request:
    branches: [ "develop" ]

jobs:

  # JOB 1: BUILD

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar con Maven (fase compile)
        run: mvn compile

  # JOB 2: TEST - (needs) build

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas con Maven (fase verify)
        run: mvn verify

      - name: Publicar reporte de pruebas
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: SpringBoot Report
          path: target/site/serenity/

  # JOB 3: DEPLOY - (needs) test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Mensaje de deploy
        run: echo "En construcción ..."
