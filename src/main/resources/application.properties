# =====================================================
# TechCupFutbol - Spring Boot Configuration
# =====================================================

# Application Name
spring.application.name=TechCupFutbol

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# =====================================================
# Base de Datos - H2 (Desarrollo)
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/TechCup
spring.datasource.username=roger
spring.datasource.password=roger
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Console (acceder en http://localhost:8080/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logger Configuration
logging.level.root=INFO
logging.level.edu.eci.dosw.tech_cup=DEBUG
logging.file.name=logs/techcup.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# =====================================================
# Swagger / OpenAPI
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =====================================================
# Security Configuration
# =====================================================
spring.security.user.name=techcupadmin
spring.security.user.password=TechCupAdmin123
