# =====================================================
# TechCupFutbol - Spring Boot Configuration
# =====================================================

# Application Name
spring.application.name=TechCupFutbol

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# =====================================================
# Base de Datos - H2 (Desarrollo)
# =====================================================
spring.datasource.url=jdbc:h2:mem:techcupdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (acceder en http://localhost:8080/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logger Configuration
logging.level.root=INFO
logging.level.edu.eci.dosw.tech_cup=DEBUG

# =====================================================
# Swagger / OpenAPI
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
